services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thc_notifications
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  migrate:
    build: ./api
    image: thc-notification-app
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db/thc_notifications
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    image: thc-notification-app
    ports:
      - "8000:8080"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db/thc_notifications
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
